name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install trusted FFmpeg tools
        run: |
          brew tap-new recastroom/legacy
          tap_root="$(brew --repository recastroom/legacy)"
          mkdir -p "$tap_root/Formula"
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/Homebrew/homebrew-core/5e8c24087d2a54c386f50dfa7bccd4a2d406b09a/Formula/f/ffmpeg.rb \
            -o "$tap_root/Formula/ffmpeg.rb"
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/Homebrew/homebrew-core/86c2371386a5f0b8a81d890ba1a233a6153ded7c/Formula/lib/libvpx.rb \
            -o "$tap_root/Formula/libvpx.rb"
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/Homebrew/homebrew-core/ea07757ef4bcf86b5c31e7684f1e0c42b01691a2/Formula/x/x265.rb \
            -o "$tap_root/Formula/x265.rb"
          brew install recastroom/legacy/ffmpeg
          brew uninstall --ignore-dependencies libvpx
          brew install recastroom/legacy/libvpx
          brew uninstall --ignore-dependencies x265
          brew install recastroom/legacy/x265
          ffmpeg -version | grep -F 'ffmpeg version 8.0.1'
          ffprobe -version | grep -F 'ffprobe version 8.0.1'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app scripts src tests tools
      - name: Check browser JavaScript
        run: |
          node --check app/web/landing.js
          node --check app/web/sound-lab.js
          node --check app/web/studio.js
          node --check app/web/wizard.js
      - name: Run tests
        run: python -m pytest -q
