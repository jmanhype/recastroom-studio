name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install trusted FFmpeg tools
        run: |
          brew install ffmpeg
          ffmpeg -version | grep -F 'ffmpeg version 8.0.1'
          ffprobe -version | grep -F 'ffprobe version 8.0.1'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app scripts src tests tools
      - name: Check browser JavaScript
        run: |
          node --check app/web/landing.js
          node --check app/web/sound-lab.js
          node --check app/web/studio.js
      - name: Run tests
        run: python -m pytest -q
