[project]
name = "recastroom-studio"
version = "0.3.2"
description = "MiniMax H3 performance-preserving video recasting studio for ComfyUI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "requests>=2.32",
  "comfy-sdk>=0.5.0",
]

[project.scripts]
recastroom = "openjutsu.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "playwright>=1.50",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openjutsu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
